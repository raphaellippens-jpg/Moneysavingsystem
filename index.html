<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#62B9E8"
    >

    <title>Money System</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div class="app">

    <!-- =====================================================
         LOGIN
    ====================================================== -->

    <section
        id="loginScreen"
        class="screen"
    >

        <h1>
            💰 MONEY SYSTEM
        </h1>

        <input
            id="loginUsername"
            type="text"
            placeholder="Username"
            autocomplete="username"
            autocapitalize="none"
        >

        <input
            id="loginPassword"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button
            id="loginButton"
            class="primary"
            type="button"
        >
            🔐 LOG IN
        </button>

        <button
            id="showCreateButton"
            class="secondary"
            type="button"
        >
            CREATE ACCOUNT
        </button>

        <p
            id="loginMessage"
            class="message"
        ></p>

    </section>


    <!-- =====================================================
         CREATE ACCOUNT
    ====================================================== -->

    <section
        id="createScreen"
        class="screen hidden"
    >

        <h1>
            CREATE ACCOUNT
        </h1>

        <input
            id="newUsername"
            type="text"
            placeholder="Username"
            autocomplete="username"
            autocapitalize="none"
        >

        <input
            id="newPassword"
            type="password"
            placeholder="Password"
            autocomplete="new-password"
        >

        <button
            id="createButton"
            class="primary"
            type="button"
        >
            CREATE ACCOUNT
        </button>

        <button
            id="backToLoginButton"
            class="secondary"
            type="button"
        >
            BACK
        </button>

        <p
            id="createMessage"
            class="message"
        ></p>

    </section>


    <!-- =====================================================
         NORMAL USER
    ====================================================== -->

    <section
        id="userScreen"
        class="screen hidden"
    >

        <h1 id="welcomeText">
            Welcome!
        </h1>

        <div class="moneyContainer">

            <div class="moneyBox balanceBox">

                <div class="moneyTitle">
                    💶 BALANCE
                </div>

                <div
                    id="balanceValue"
                    class="moneyValue"
                >
                    €0.00
                </div>

            </div>


            <div class="moneyBox savedBox">

                <div class="moneyTitle">
                    🏦 SAVED
                </div>

                <div
                    id="savedValue"
                    class="moneyValue"
                >
                    €0.00
                </div>

            </div>

        </div>


        <div class="actionButtons">

            <button
                id="buyButton"
                class="buy"
                type="button"
            >
                🔴 BUY
            </button>

            <button
                id="saveButton"
                class="save"
                type="button"
            >
                🟢 SAVE
            </button>

            <button
                id="withdrawButton"
                class="withdraw"
                type="button"
            >
                🟣 WITHDRAW
            </button>

        </div>


        <p
            id="userMessage"
            class="message"
        ></p>


        <button
            id="userLogoutButton"
            class="logout"
            type="button"
        >
            LOG OUT
        </button>


        <button
            id="deleteOwnAccountButton"
            class="deleteOwn"
            type="button"
        >
            🗑️ DELETE MY ACCOUNT
        </button>

    </section>


    <!-- =====================================================
         MOM / ADMIN
    ====================================================== -->

    <section
        id="adminScreen"
        class="screen hidden"
    >

        <h1 class="adminTitle">
            👑 MOM PANEL
        </h1>

        <h2>
            Accounts
        </h2>

        <div
            id="accountList"
            class="accountList"
        ></div>


        <button
            id="deleteMomButton"
            class="deleteMom"
            type="button"
        >
            🗑️ DELETE MOM ACCOUNT
        </button>


        <button
            id="adminLogoutButton"
            class="logout"
            type="button"
        >
            LOG OUT
        </button>

    </section>


    <!-- =====================================================
         LOADING
    ====================================================== -->

    <div
        id="loading"
        class="loading hidden"
    >
        <div class="loadingBox">
            <div class="spinner"></div>

            <div id="loadingText">
                Connecting...
            </div>
        </div>
    </div>

</div>


<!-- =========================================================
     SUPABASE

     THIS MUST LOAD BEFORE script.js
========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- =========================================================
     MONEY SYSTEM
========================================================= -->

<script src="script.js"></script>

</body>
</html>
